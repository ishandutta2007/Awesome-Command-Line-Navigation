<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".4" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes blink{0%,49%{opacity:1}50%{opacity:0}}@keyframes floatSlow{0%{transform:translateY(0)}}@keyframes floatReverse{0%{transform:translateY(0)}}@keyframes pulseGlow{0%{opacity:.25;transform:scale(.98)}}@keyframes dotPulse{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.4);opacity:1}}.cursor-blink{animation:blink 1s infinite}.float-card1{animation:floatSlow 6s ease-in-out infinite alternate}.float-card2{animation:floatReverse 7s ease-in-out infinite alternate}.float-card3{animation:floatSlow 8s ease-in-out infinite alternate}.pulse-glow{animation:pulseGlow 4s ease-in-out infinite alternate}.stream-line{stroke-dasharray:8 12;animation:dashMove 20s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGradient)" rx="16"/><rect width=