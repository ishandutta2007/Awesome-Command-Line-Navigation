<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .cursor-blink {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .float-card1 {
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .float-card2 {
      animation: floatReverse 7s ease-in-out infinite alternate;
    }
    .float-card3 {
      animation: floatSlow 8s ease-in-out infinite alternate;
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes floatReverse {
      0% { transform: translateY(0px); }
      100% { transform: translateY(14px); }
    }

    .pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.25; transform: scale(0.98); }
      100% { opacity: 0.55; transform: scale(1.02); }
    }

    .pulse-dot {
      animation: dotPulse 2s infinite;
    }
    @keyframes dotPulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    .stream-line {
      stroke-dasharray: 8 12;
      animation: dashMove 20s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -400; }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="16" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Ambient Light Orbs (Background Dynamic Aura) -->
  <circle cx="180" cy="80" r="140" fill="#38bdf8" filter="url(#softGlow)" class="pulse-glow" style="transform-origin: 180px 80px;" />
  <circle cx="1020" cy="280" r="160" fill="#818cf8" filter="url(#softGlow)" class="pulse-glow" style="transform-origin: 1020px 280px; animation-delay: -2s;" />

  <!-- Dynamic Data Stream Circuit Lines (Background) -->
  <path d="M 0 60 Q 300 120 600 60 T 1200 80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="stream-line" />
  <path d="M 0 300 Q 400 240 800 320 T 1200 280" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" class="stream-line" />

  <!-- Floating Dynamic Tech Pills / Badges (Subtly Placed In Lower Background & Sides) -->
  <g class="float-card1">
    <!-- Interactive Tag 1 -->
    <rect x="60" y="270" width="165" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" opacity="0.9" />
    <circle cx="82" cy="291" r="5" fill="#38bdf8" />
    <text x="96" y="296" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Frecent Jump</text>
  </g>

  <g class="float-card2">
    <!-- Interactive Tag 2 -->
    <rect x="975" y="50" width="165" height="42" rx="21" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" opacity="0.9" />
    <circle cx="997" cy="71" r="5" fill="#c084fc" />
    <text x="1011" y="76" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔍 Fuzzy Search</text>
  </g>

  <g class="float-card3">
    <!-- Interactive Tag 3 -->
    <rect x="975" y="270" width="165" height="42" rx="21" fill="#0f172a" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" opacity="0.9" />
    <circle cx="997" cy="291" r="5" fill="#34d399" />
    <text x="1011" y="296" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📜 Sync History</text>
  </g>

  <!-- Central Foreground Terminal Window & Header -->
  <!-- Outer Window Container -->
  <g id="foreground-content">
    <!-- Window Bar Dot Controls -->
    <circle cx="85" cy="55" r="6" fill="#ef4444" opacity="0.9" />
    <circle cx="105" cy="55" r="6" fill="#f59e0b" opacity="0.9" />
    <circle cx="125" cy="55" r="6" fill="#10b981" opacity="0.9" />
    <text x="145" y="59" fill="#475569" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">cli-navigator ~ bash/zsh/fish</text>

    <!-- Prompt Row Foreground -->
    <g transform="translate(600, 105)">
      <rect x="-190" y="-22" width="380" height="34" rx="17" fill="#030712" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="0" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', 'Cascadia Code', monospace" font-size="14" font-weight="600">
        <tspan fill="#10b981">➜</tspan> <tspan fill="#38bdf8">~</tspan> <tspan fill="#f1f5f9">zoxide + fzf + atuin + yazi</tspan><tspan fill="#38bdf8" class="cursor-blink"> ▋</tspan>
      </text>
    </g>

    <!-- Main Title in Foreground -->
    <text x="600" y="180" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1" filter="url(#glow)">
      Awesome Command Line Navigation
    </text>

    <!-- Subtitle in Foreground -->
    <text x="600" y="222" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">
      The Curated Directory Jumping, Fuzzy Finding &amp; Shell History Stack
    </text>

    <!-- Secondary Meta Description -->
    <text x="600" y="255" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      ⚡ Ultra-Fast File Navigation • 🚀 Terminal Emulators • 🔄 SQLite-Backed History • 📦 Top Open-Source Tools
    </text>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
</svg>
